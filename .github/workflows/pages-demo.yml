# Demo site for THIS repository (the maintainers' examples gallery). Users who fork or use the template
# should use pages.yml instead, which publishes trip/. Enable Pages → Source: GitHub Actions before running.
name: Deploy examples gallery

on:
  workflow_dispatch:
  push:
    branches: [main]
    # Downloads contain skills, docs and agent entrypoints too: every source update rebuilds them.

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-demo
  cancel-in-progress: true

jobs:
  build:
    # Upstream only: copies made from the template publish trip/ with pages.yml instead.
    if: github.repository == 'clarkchenkai/travel.skill'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build the Kumano showcase
        working-directory: showcase/kumano-kodo
        run: |
          python3 -m pip install -r requirements.txt
          npm ci
          npm run build:visuals
          python3 build.py --public-only --package
      - name: Build gallery
        run: node scripts/build-site.mjs --require-showcase --out site-dist --base "/${{ github.event.repository.name }}/" --site "https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site-dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
